<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mxblue" x1="180" y1="180" x2="332" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="34%" stop-color="#3b82f6"/>
      <stop offset="62%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="mxpurple" x1="180" y1="332" x2="332" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="30%" stop-color="#c4b5fd"/>
      <stop offset="58%" stop-color="#e2e8f0"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <!-- Full bleed, artwork inside the 80% safe zone so Android's mask can crop
       to a circle without clipping the X. -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <g stroke-width="46" fill="none" stroke-linecap="butt">
    <line x1="180" y1="180" x2="332" y2="332" stroke="url(#mxblue)"/>
    <line x1="180" y1="332" x2="332" y2="180" stroke="url(#mxpurple)"/>
  </g>
</svg>
