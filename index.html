<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale / user-scalable=no: blocking pinch-zoom is an
      accessibility failure, and iOS ignores it anyway. viewport-fit=cover lets
      the app paint under the notch and home indicator, which the safe-area
      padding in index.css then compensates for.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#006a6a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="BhoomiX Partner — accept deliveries, navigate to customers, and track earnings." />

    <title>BhoomiX Partner</title>

    <!-- Installable on a partner's home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BhoomiX Partner" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
